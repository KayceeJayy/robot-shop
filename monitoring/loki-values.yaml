# Capstone 2 - Loki on AWS EKS
# Single replica, internal access, persistent gp3 storage.

deploymentMode: Monolithic

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: filesystem

  limits_config:
    allow_structured_metadata: true
    volume_enabled: true

singleBinary:
  replicas: 1

  persistence:
    enabled: true
    storageClass: gp3
    size: 8Gi
    enableStatefulSetAutoDeletePVC: false

  resources:
    requests:
      cpu: 150m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

gateway:
  enabled: true
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 30m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

chunksCache:
  enabled: false

resultsCache:
  enabled: false

lokiCanary:
  enabled: false


backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

test:
  enabled: false
