# Robot Shop Capstone - Local Prometheus
# Chart: prometheus-community/prometheus 29.47.2
# Target: Kind cluster capstone-local

server:
  replicaCount: 1

  global:
    scrape_interval: 30s
    scrape_timeout: 10s
    evaluation_interval: 30s

  retention: "24h"
  retentionSize: "1GB"

  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: 800m
      memory: 1Gi

  persistentVolume:
    enabled: true
    storageClass: standard
    size: 2Gi

  service:
    type: ClusterIP

  ingress:
    enabled: false

alertmanager:
  enabled: true
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 192Mi

kube-state-metrics:
  enabled: true
  resources:
    requests:
      cpu: 30m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 192Mi

prometheus-node-exporter:
  enabled: true
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

prometheus-pushgateway:
  enabled: false

extraScrapeConfigs: |
  - job_name: robot-shop-cart
    metrics_path: /metrics
    static_configs:
      - targets:
          - cart.robot-shop.svc.cluster.local:8080
        labels:
          namespace: robot-shop
          service: cart

  - job_name: robot-shop-rabbitmq
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - robot-shop
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_service]
        action: keep
        regex: rabbitmq
      - source_labels: [__meta_kubernetes_pod_phase]
        action: keep
        regex: Running
      - source_labels: [__meta_kubernetes_pod_ip]
        action: replace
        regex: "(.+)"
        target_label: __address__
        replacement: "$1:15692"
      - target_label: namespace
        replacement: robot-shop
      - target_label: service
        replacement: rabbitmq
