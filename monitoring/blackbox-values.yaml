# Synthetic HTTP monitoring for Capstone 2.
# Measures endpoint success and probe latency, not total user traffic.

fullnameOverride: robot-shop-blackbox

resources:
  requests:
    cpu: 30m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

serviceMonitor:
  enabled: true
  defaults:
    interval: 30s
    scrapeTimeout: 15s
    module: http_2xx

  targets:
    - name: web
      url: http://web.robot-shop.svc.cluster.local:8080/
      additionalMetricsRelabels:
        service: web

    - name: catalogue
      url: http://catalogue.robot-shop.svc.cluster.local:8080/products
      additionalMetricsRelabels:
        service: catalogue

    - name: cart
      url: http://cart.robot-shop.svc.cluster.local:8080/health
      additionalMetricsRelabels:
        service: cart

    - name: payment
      url: http://payment.robot-shop.svc.cluster.local:8080/health
      additionalMetricsRelabels:
        service: payment
