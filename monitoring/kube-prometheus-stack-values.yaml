# Capstone 2 - kube-prometheus-stack on AWS EKS

kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

grafana:
  enabled: true
  service:
    type: ClusterIP
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: monitoring

prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

prometheus:
  prometheusSpec:
    retention: 24h
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi

    additionalScrapeConfigs:
      - job_name: robot-shop-cart
        scrape_interval: 30s
        metrics_path: /metrics
        static_configs:
          - targets:
              - cart.robot-shop.svc.cluster.local:8080
            labels:
              namespace: robot-shop
              service: cart

      - job_name: robot-shop-rabbitmq
        scrape_interval: 30s
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [robot-shop]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_service]
            action: keep
            regex: rabbitmq
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            regex: "(.+)"
            target_label: __address__
            replacement: "$1:15692"
          - target_label: service
            replacement: rabbitmq

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 512Mi
